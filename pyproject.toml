[project]
name = "agriguard-ai"
version = "1.0.0"
description = "AgriGuard — AI-Powered Pest Detection and Community Outbreak Early Warning System (AI & Data layer)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgriGuard Team" }]
keywords = ["agriculture", "pest-detection", "AI", "Rwanda", "smallholder-farmers"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "node_modules*"]

# ── pytest configuration ────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "ai/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
